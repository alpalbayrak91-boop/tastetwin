name: Windows installer

# Push a tag like v0.6.0 to publish TasteTwin-Setup.exe and the extension ZIP
# on the GitHub Releases page. Run manually to get the installer as a build
# artifact without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: TasteTwin-windows
          path: |
            out/make/squirrel.windows/x64/TasteTwin-Setup.exe
            public/tastetwin-extension.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/squirrel.windows/x64/TasteTwin-Setup.exe
            public/tastetwin-extension.zip
          generate_release_notes: true
